name: Toolchain
description: Node.js 22 with npm ci from the lockfile, and Rust with the wasm32 target.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: npm ci
      shell: bash
      run: npm ci
