name: Toolchain
description: Node.js 22 with npm ci from the lockfile, Rust with the wasm32 target, and just.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    # test/justfile.test.ts reads the justfile through just and fails without it in CI
    - uses: taiki-e/install-action@v2
      with:
        tool: just@1.59.0

    - name: npm ci
      shell: bash
      run: npm ci
