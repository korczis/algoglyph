name: CI

# Runs on pull requests and non-main branches, and is called by pages.yml for main, so the gate
# in front of a deployment is exactly the gate in front of a merge. Same order as
# scripts/verify-all.sh.
on:
  pull_request:
  push:
    branches-ignore: [main]
  # manual "validate": gh workflow run ci.yml --ref <branch>  (scripts/deploy.sh validate)
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label for every job
        type: string
        default: ubuntu-latest
  workflow_call:
    inputs:
      runner:
        description: Runner label for every job; pages.yml passes the dedicated self-hosted runner
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit subjects
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head="${PR_HEAD:-$GITHUB_SHA}"
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$head"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$head"
          else
            range="$(git rev-list --max-parents=0 "$head" | tail -n 1)..$head"
          fi
          scripts/lint-commits.sh --range "$range"

  supervision:
    name: Majordomus supervision
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      MAJORDOMUS_VERSION: v1.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install majordomus (pinned; the installer verifies the SHA-256 of the release)
        run: |
          curl -fsSL https://majordomus.dev/install.sh | sh -s -- --version "$MAJORDOMUS_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: majordomus doctor
        env:
          # licence evidence for the declared Flowbite Pro kit; a public tree fails closed
          # without it (owner decision 2026-10-28)
          MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO: ${{ secrets.MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO }}
        run: |
          git config core.hooksPath .githooks
          majordomus version
          majordomus doctor

  validate:
    name: Validate and build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # Measured: run 43083820780 (19 plates, lundra-algoglyph) took 1311 s, of which the browser
    # gate waited for every thumbnail in all four theme/width contexts. The gate now waits for
    # thumbnails only at desktop width; 45 min keeps twice the measured time as margin and stops
    # a hung browser long before the 6 h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Derived facts (no hand-typed counts, plate numbers or dangling links)
        run: node scripts/check-facts.mjs
      - name: Rust kernels (native tests, wasm32 build; the .wasm is never committed)
        run: scripts/wasm.sh
      - name: Catalogue (schema, references, live and code agree, derived plan current)
        run: node scripts/catalogue.mjs --check
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (algorithms against reference values, integrator invariants)
        run: npx vitest run --exclude test/budget.test.ts
      # Alone, after the suite: wall-clock budgets read preemption by parallel test files on a
      # small runner as a slow plate (Pages run 43115536542: gray-scott 55 ms here, 1.9 ms alone).
      - name: Main-thread budget at the heaviest settings (test/budget.test.ts, config/budgets.yaml)
        run: npm run test:budget
      - name: README derived sections are current (scripts/build-readme.mjs --check)
        run: node scripts/build-readme.mjs --check
      - name: Build (stamps dist/revision.txt with the commit)
        run: npx vite build
      # Hosted runners install Playwright's Chromium with its system dependencies; the
      # self-hosted lundra runner uses the Google Chrome already installed there and installs
      # nothing system-wide (ADR 0003).
      - name: Browser gate (axe WCAG 2.2 AA, console errors, overflow, every plate renders)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            npx playwright-core install --with-deps chromium
            export AUDIT_CHANNEL=''
          else
            export AUDIT_CHANNEL=chrome
          fi
          node scripts/audit-ui.mjs --screenshots "$RUNNER_TEMP/screenshots"
      - name: Upload the browser gate screenshots (gallery and every plate, both themes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          if-no-files-found: error
