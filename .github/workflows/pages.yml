name: Pages

# main: validate -> deploy -> verify production. Each stage runs only if the previous one passed.
# Automated on every push to main; by hand with: gh workflow run pages.yml --ref main
# (scripts/deploy.sh deploy). Runs on the dedicated self-hosted runner lundra-algoglyph
# (ADR 0003); pull-request CI stays on GitHub-hosted runners, so no fork reaches lundra.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      runner: lundra-algoglyph
    permissions:
      contents: read

  deploy:
    name: Deploy
    needs: ci
    runs-on: lundra-algoglyph
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Download the validated site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify
    needs: deploy
    uses: ./.github/workflows/verify.yml
    with:
      sha: ${{ github.sha }}
      base_url: ${{ needs.deploy.outputs.page_url }}
      runner: lundra-algoglyph
