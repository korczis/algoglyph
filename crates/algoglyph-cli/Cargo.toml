[package]
name = "algoglyph-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.85"
description = "algoglyph's tooling as one CLI whose checks are Rhai scripts discovered by convention (ADR 0005 §6)."

[[bin]]
name = "algoglyph"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.19"
regex = "1.11"
# Pinned exactly: a plugin's language is part of the repository's contract.
rhai = "=1.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
