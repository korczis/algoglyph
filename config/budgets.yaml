# The main-thread budget every plate and lab must fit (test/budget.test.ts). A plate that
# computes a whole run at creation, or does unbounded work per frame, freezes a phone; the
# independent reviews of 2026-11-11 found that class in the grid, hash, bespoke and stochastic
# waves at once, so it is gated in the core for every engine, present and future.
# Measured on the machine running the tests, at every range control's maximum and each select
# option in turn, with drawing stubbed out: this is the plate's own computation. The bounds are
# generous on purpose (shared CI runners, phones 3-5x slower than a desktop); they catch
# seconds at creation and tens of milliseconds per frame, not noise.
# Time is the CPU time the test process uses, not wall-clock time, and the file runs alone
# (`npm run test:budget`, after the rest of `npm test`): preemption by other processes or by
# parallel test files is not the plate's cost.
version: 1
create_ms: 400        # setup() plus the first frame
frame_ms: 40          # the worst of the measured frames
frames: 30            # frames measured after setup
repeats: 3            # runs per setting; the best is judged (a run within budget ends the repeats)
widths: [390, 1440]   # canvas widths measured: a phone and a desktop (the browser gate's widths)
horizon_frames: 900   # frames driven past the first window, to reach a run's end and its rebuild
horizon_cpu_ms: 3000  # ...or this much CPU, whichever comes first
drag_steps: 8         # steps of a slider swept from its minimum to its maximum, one per frame
reference_cpu_ms: 2.9   # referenceCpuMs() in test/budget.test.ts on the reference machine (an M-series Mac,
                        # best of seven at 2026-11-12T00:21Z); budgets scale by measured / this, never below 1
local_headroom: 0.6     # outside CI (no CI env var) the budgets are this fraction: local green predicts CI green

# The browser gate's waits (scripts/audit-ui.mjs): how long a page may take on the machine running
# the gate before a missing picture or readout counts as a failure. Generous on purpose: a wait
# costs time only when something is genuinely missing.
browser:
  readout_ms: 120000      # a plate or lab mounts its canvas and publishes its first readout
  thumb_ms: 90000         # each gallery thumbnail of a wing (the wing's budget is this × its cards)
