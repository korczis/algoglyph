# The main-thread budget every plate and lab must fit (test/budget/). A plate that
# computes a whole run at creation, or does unbounded work per frame, freezes a phone; the
# independent reviews of 2026-11-11 found that class in the grid, hash, bespoke and stochastic
# waves at once, so it is gated in the core for every engine, present and future.
# Measured on the machine running the tests, at every range control's maximum and each select
# option in turn, with drawing stubbed out: this is the plate's own computation. The bounds are
# generous on purpose (shared CI runners, phones 3-5x slower than a desktop); they catch
# seconds at creation and tens of milliseconds per frame, not noise.
# Time is the CPU time the test process uses, not wall-clock time, and the file runs alone
# (`npm run test:budget`, after the rest of `npm test`): preemption by other processes or by
# parallel test files is not the plate's cost.
version: 1
create_ms: 400        # setup() plus the first frame
frame_ms: 40          # the worst of the measured frames
frames: 30            # frames measured after setup
repeats: 3            # runs per setting; the best is judged (a run within budget ends the repeats)
widths: [390, 1440]   # canvas widths measured: a phone and a desktop (the browser gate's widths)
horizon_frames: 900   # frames driven past the first window, to reach a run's end and its rebuild
horizon_cpu_ms: 3000  # ...or this much CPU, whichever comes first
drag_steps: 8         # steps of a slider swept from its minimum to its maximum, one per frame
reference_cpu_ms: 2.9   # referenceCpuMs() in test/support/budget.ts on the reference machine (an M-series Mac,
                        # best of seven at 2026-11-12T00:21Z); budgets scale by measured / this, never below 1
local_headroom: 0.6     # outside CI (no CI env var) the budgets are this fraction: local green predicts CI green
# What the gate measures is not quite the site. The gate runs under vitest, whose module transform
# turns each imported binding into a property read on a module object; the site ships a bundle
# where an import is a plain binding. scripts/budget-vs-bundle.mjs times the same corners both
# ways in one process (2026-11-17, tree e3ffed0, load ~5; thread CPU per frame, best of 2):
#   ripple-tank double slit, res 2, 8 steps  median 10.45 vs 3.18 ms (3.3x), worst 13.78 vs 3.40 (4.1x)
#   gray-scott, res 2, 40 steps              median  9.39 vs 3.32 ms (2.8x), worst 11.51 vs 3.86 (3.0x)
#   boids-3d, 1500 at radius 0.3             median  6.89 vs 6.87 ms (1.0x), worst  9.71 vs 10.25
#   lorenz-attractor, 48 x 2400, 12 steps    median  1.32 vs 1.32 ms (1.0x), worst  3.16 vs 2.87
# A second run minutes later: 3.2x / 2.9x, 2.9x / 3.0x, 0.95x / 0.94x, 0.95x / 0.67x (median /
# worst); the medians repeat to a few percent, a single worst frame does not.
# The two over 1 call an imported function in a per-cell loop (flush from src/core/budget.ts);
# the two at 1 call none. So the margin errs safe, by up to 3-4x exactly where a hot loop reads
# an import, and by nothing elsewhere: a reading near the budget is real unless the plate has that
# pattern, and the cure (a local copy, bit-equal) is cheap in both runtimes. The thresholds stay.
# The budget a capped sorting kernel's max_n is measured against (test/sorting-max-n.test.ts), in
# reference milliseconds of one rebuild; ALGOGLYPH_MAX_N_MS overrides it for one run only.
max_n_budget_ms: 17
# A capped sorting kernel's max_n is the largest n whose measured rebuild costs at most this
# fraction of max_n_budget_ms. At the budget itself (margin 1) the bound held no slack for load on
# the gate's machine: spaghetti-sort's
# rebuild at its bound 448 {reversed, pace 4096, loop} failed the gate twice, 26.2 ms against
# 26.0 (1.09x the reference, load average 31-36) and 27.7 against 26.5.
max_n_margin: 0.9

# The browser gate's waits (scripts/audit-ui.mjs): how long a page may take on the machine running
# the gate before a missing picture or readout counts as a failure. Generous on purpose: a wait
# costs time only when something is genuinely missing.
browser:
  readout_ms: 30000       # a plate or lab mounts its canvas and publishes its first readout; a page
                          # slower than this is a finding to fix, not a wait to raise
  thumb_ms: 90000         # each gallery thumbnail of a wing (the wing's budget is this × its cards)
  # A page that misses readout_ms is opened again this many times: a page that never publishes
  # misses every visit, a stall of the gate's machine does not (Pages runs 43133085956: identical
  # code gave long tasks of 0.1-5.7 s on the x86 runner while its host swapped 13 GB).
  readout_retries: 1
  max_retries: 6          # more retries than this in one run fail it: too slow a machine to judge
