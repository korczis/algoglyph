# Sorting sidecar: the atlas sorting catalogue folded into this catalogue, one record per
# atlas algorithm. DERIVED, not hand-typed: every value is converted from the atlas data
# (data/ids.json, data/algorithms/*.toml) and from the META block of each atlas kernel
# (stable, in_place, kind). Regenerate it from those sources; never edit a value by hand.
#
# It carries what the v1 entry schema has no field for (year, authors, kind, time and space
# bounds, stability, in-place, adaptive, online, parallel). The semantic-v2 schema PR absorbs
# it into the entries' front matter, after which this file is deleted.
#
# id: the catalogue entry id (catalogue/entries/<id>.md); one entry may stand for more than
# one atlas algorithm (see mapping). existing: the entry predates the fold. kernel: the atlas
# kernel (Rust plugin) id, which is the atlas slug. time_* and space use the atlas notation
# (n^2, log^2 n, "unknown"); stable may be "variant" where only some formulations are stable.
# custom_plate: why an entry cannot be an array-engine plate and needs a bespoke one.
version: 1

